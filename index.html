<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk Pro | Support Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .card h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .ticket-item {
            background: #fff;
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: transform 0.1s;
        }

        .ticket-item:hover {
            border-color: #cbd5e1;
        }

        .ticket-info h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
        }

        .ticket-info p {
            margin: 8px 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.low { background: #e0f2fe; color: #0369a1; }
        .badge.medium { background: #fef9c3; color: #854d0e; }
        .badge.high { background: #fee2e2; color: #991b1b; }

        .badge.status-open { background: #dcfce7; color: #166534; }
        .badge.status-resolved { background: #f1f5f9; color: #475569; text-decoration: line-through; }

        .ticket-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
            background: #e2e8f0;
            color: var(--text-main);
        }
        .btn-sm:hover { background: #cbd5e1; }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>HelpDesk Pro</h1>
            <p>Submit and track your support inquiries efficiently.</p>
        </header>

        <!-- Submit Form Card -->
        <div class="card">
            <h2>Create New Ticket</h2>
            <form id="ticketForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="Technical Bug">Technical Bug</option>
                            <option value="Billing Issue">Billing Issue</option>
                            <option value="Feature Request">Feature Request</option>
                            <option value="General Inquiry">General Inquiry</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="priority">Priority Level</label>
                        <select id="priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label for="issue">Describe Your Issue</label>
                        <textarea id="issue" rows="3" placeholder="Provide as much detail as possible..." required></textarea>
                    </div>
                </div>
                <button type="submit">Submit Support Ticket</button>
            </form>
        </div>

        <!-- Tickets List Card -->
        <div class="card">
            <h2>Active Tickets</h2>
            <div id="ticketList">
                <div class="empty-state">No active tickets found.</div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('ticketForm');
        const ticketList = document.getElementById('ticketList');

        let tickets = JSON.parse(localStorage.getItem('tickets')) || [];
        renderTickets();

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const category = document.getElementById('category').value;
            const priority = document.getElementById('priority').value;
            const issue = document.getElementById('issue').value;

            const newTicket = {
                id: Math.floor(1000 + Math.random() * 9000),
                name,
                category,
                priority,
                issue,
                status: 'Open',
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            };

            tickets.unshift(newTicket); // Add to the top of the list
            localStorage.setItem('tickets', JSON.stringify(tickets));

            renderTickets();
            form.reset();
        });

        function toggleStatus(id) {
            tickets = tickets.map(t => {
                if (t.id === id) {
                    t.status = t.status === 'Open' ? 'Resolved' : 'Open';
                }
                return t;
            });
            localStorage.setItem('tickets', JSON.stringify(tickets));
            renderTickets();
        }

        function deleteTicket(id) {
            tickets = tickets.filter(t => t.id !== id);
            localStorage.setItem('tickets', JSON.stringify(tickets));
            renderTickets();
        }

        function renderTickets() {
            if (tickets.length === 0) {
                ticketList.innerHTML = '<div class="empty-state">No active tickets found.</div>';
                return;
            }

            ticketList.innerHTML = tickets.map(t => `
                <div class="ticket-item">
                    <div class="ticket-info">
                        <h3>#${t.id} - ${t.category}</h3>
                        <p>${t.issue}</p>
                        <div class="meta">
                            <span>By <strong>${t.name}</strong></span>
                            <span>📅 ${t.date}</span>
                            <span class="badge ${t.priority.toLowerCase()}">${t.priority}</span>
                            <span class="badge status-${t.status.toLowerCase()}">${t.status}</span>
                        </div>
                    </div>
                    <div class="ticket-actions">
                        <button class="btn-sm" onclick="toggleStatus(${t.id})">${t.status === 'Open' ? 'Resolve' : 'Reopen'}</button>
                        <button class="btn-sm" style="background:#fee2e2; color:#991b1b;" onclick="deleteTicket(${t.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
